name: Build Android APK

'on':
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -e
          if [ ! -f "android/settings.gradle.kts" ]; then
            shopt -s nullglob
            zips=( *.zip )
            if [ ${#zips[@]} -gt 0 ]; then
              unzip -o "${zips[0]}" -d .
            fi
          fi

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          if [ -f "android/settings.gradle.kts" ]; then
            ANDROID_DIR="android"
          else
            ANDROID_DIR=$(find . -type f -path '*/android/settings.gradle.kts' -print -quit | sed 's#/settings.gradle.kts$##')
          fi
          if [ -z "${ANDROID_DIR:-}" ]; then
            echo "Android project not found."
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          gradle assembleDebug --no-daemon -Pkotlin.compiler.jvmTarget=17

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAIAssistant-V5-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
